# docker compose up --build   ->  http://localhost:5000
services:
  app:
    build: .
    ports: ["5000:5000"]
    environment:
      MONGO_URI: mongodb://mongo:27017/blogsphere
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in your shell or a .env file}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      COOKIE_SECURE: "false"   # plain HTTP on localhost; remove behind HTTPS
    volumes:
      - uploads:/app/uploads
    depends_on: [mongo]
  mongo:
    image: mongo:7
    volumes:
      - mongo:/data/db
volumes:
  uploads:
  mongo:
