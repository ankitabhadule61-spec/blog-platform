  <style>
    /* =====================================================
       BLOGSPHERE DASHBOARD
       Modern editorial + poppy colour direction
       ===================================================== */

    .dashboard-page {
      position: relative;
      overflow: hidden;
      padding: 34px 0 90px;
    }

    /* Decorative background blobs */
    .dashboard-page::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      top: -180px;
      right: -120px;
      border-radius: 50%;
      background: rgba(255, 92, 92, 0.10);
      filter: blur(10px);
      pointer-events: none;
    }

    .dashboard-page::after {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      bottom: 80px;
      left: -180px;
      border-radius: 50%;
      background: rgba(117, 87, 255, 0.08);
      filter: blur(10px);
      pointer-events: none;
    }

    .dashboard-inner {
      position: relative;
      z-index: 1;
    }

    /* ---------- HERO ---------- */

    .dashboard-hero {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      padding: 38px 42px;
      margin-bottom: 26px;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(
          circle at 88% 20%,
          rgba(117, 87, 255, 0.25),
          transparent 25%
        ),
        linear-gradient(
          120deg,
          #fff0eb 0%,
          #fff9dc 48%,
          #eeeaff 100%
        );
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 24px 65px rgba(65, 38, 73, .10);
    }

    .dashboard-hero::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: 90px;
      bottom: -90px;
      border-radius: 50%;
      border: 30px solid rgba(19, 184, 166, .12);
    }

    :root[data-theme="dark"] .dashboard-hero {
      background:
        radial-gradient(
          circle at 88% 20%,
          rgba(155, 133, 255, .20),
          transparent 25%
        ),
        linear-gradient(
          120deg,
          #351f27,
          #30291d,
          #292243
        );
      border-color: var(--line);
    }

    .dashboard-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 12px;
      color: var(--accent);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .dashboard-eyebrow i {
      font-size: .8rem;
    }

    .dashboard-title {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2.5rem, 6vw, 4.8rem);
      line-height: .95;
      letter-spacing: -.055em;
      font-weight: 650;
      max-width: 700px;
    }

    .dashboard-subtitle {
      margin: 16px 0 0;
      max-width: 600px;
      color: var(--ink-2);
      font-size: 1.03rem;
      line-height: 1.6;
    }

    .dashboard-actions {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .new-post-btn {
      min-height: 48px;
      padding: 0 21px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(
        135deg,
        #ff5c5c,
        #ff7654
      );
      box-shadow:
        0 12px 28px rgba(255, 92, 92, .27),
        inset 0 1px 0 rgba(255,255,255,.25);
      font-weight: 700;
      text-decoration: none;
      transition:
        transform .18s ease,
        box-shadow .18s ease;
    }

    .new-post-btn:hover {
      transform: translateY(-3px);
      color: #fff;
      box-shadow:
        0 17px 34px rgba(255, 92, 92, .34);
    }

    .new-post-btn i {
      margin-right: 7px;
    }

    /* ---------- STATS ---------- */

    .stats {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 0 0 28px;
    }

    .stat {
      position: relative;
      min-height: 130px;
      padding: 22px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 10px 28px rgba(62, 35, 75, .07);
      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .stat:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(62, 35, 75, .12);
    }

    .stat::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      right: -30px;
      bottom: -38px;
      border-radius: 50%;
      background: var(--stat-color, #ff5c5c);
      opacity: .10;
    }

    .stat:nth-child(1) {
      --stat-color: #ff5c5c;
    }

    .stat:nth-child(2) {
      --stat-color: #7557ff;
    }

    .stat:nth-child(3) {
      --stat-color: #13b8a6;
    }

    .stat:nth-child(4) {
      --stat-color: #f0b429;
    }

    .stat-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      margin-bottom: 15px;
      border-radius: 12px;
      color: var(--stat-color);
      background: color-mix(
        in srgb,
        var(--stat-color) 12%,
        transparent
      );
      font-size: 1.1rem;
    }

    .stat b {
      position: relative;
      z-index: 1;
      display: block;
      margin-bottom: 3px;
      color: var(--stat-color);
      font: 700 2rem/1 var(--serif);
      letter-spacing: -.03em;
    }

    .stat span {
      position: relative;
      z-index: 1;
      color: var(--ink-3);
      font-size: .82rem;
      font-weight: 600;
    }

    /* ---------- POSTS AREA ---------- */

    .dashboard-content {
      position: relative;
      z-index: 1;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: color-mix(
        in srgb,
        var(--surface) 92%,
        transparent
      );
      box-shadow: 0 15px 45px rgba(62, 35, 75, .06);
    }

    .content-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 4px;
    }

    .content-title {
      margin: 0;
      font: 650 1.8rem/1 var(--serif);
      letter-spacing: -.03em;
    }

    .content-description {
      margin: 7px 0 0;
      color: var(--ink-3);
      font-size: .9rem;
    }

    /* ---------- FILTER TABS ---------- */

    #filters {
      display: flex;
      gap: 7px;
      margin: 24px 0 5px;
      padding: 5px;
      width: fit-content;
      max-width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
    }

    #filters button {
      border: 0;
      border-radius: 10px;
      padding: 9px 16px;
      margin: 0;
      background: transparent;
      color: var(--ink-3);
      font-size: .88rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition:
        color .15s ease,
        background .15s ease,
        transform .15s ease;
    }

    #filters button:hover {
      color: var(--ink);
      transform: translateY(-1px);
    }

    #filters button.on {
      color: #fff;
      background: linear-gradient(
        135deg,
        var(--accent),
        #ff7654
      );
      box-shadow: 0 6px 15px rgba(255, 92, 92, .20);
    }

    /* ---------- LIST ---------- */

    #list {
      min-height: 160px;
    }

    #list .row {
      padding: 22px 0;
    }

    #list .row:last-child {
      border-bottom: 0;
    }

    /* ---------- PAGINATION ---------- */

    .pager {
      margin-top: 12px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 900px) {
      .dashboard-hero {
        align-items: flex-start;
        flex-direction: column;
      }

      .dashboard-actions {
        width: 100%;
      }

      .new-post-btn {
        width: 100%;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 620px) {
      .dashboard-page {
        padding-top: 20px;
      }

      .dashboard-hero {
        padding: 28px 23px;
        border-radius: 22px;
      }

      .dashboard-title {
        font-size: 3rem;
      }

      .dashboard-content {
        padding: 17px;
        border-radius: 19px;
      }

      .content-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .stat {
        min-height: 115px;
        padding: 16px;
      }

      .stat b {
        font-size: 1.65rem;
      }

      .stat-icon {
        width: 34px;
        height: 34px;
      }

      #filters {
        width: 100%;
      }

      #filters button {
        flex: 1;
      }
    }

    @media (max-width: 420px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .dashboard-title {
        font-size: 2.65rem;
      }
    }
  </style>

</head>

<body>
