<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in – BlogSphere</title>
<meta name="description" content="Log in to BlogSphere.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232441c8'/%3E%3Crect x='8' y='18' width='16' height='6' fill='%23ffe45c'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='20' font-weight='700' text-anchor='middle' fill='white'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/app.js" defer></script>
<script src="/js/auth.js" defer></script>
</head>
<body>
<header id="nav"></header>
<main>
<div class="wrap-form auth">
  <h1>Welcome back</h1>
  <p class="sub">Log in to write, like and comment.</p>
  <div class="alert" id="err" role="alert" hidden></div>
  <form id="form" novalidate>
    <label class="field"><span>Email</span><input class="input" type="email" name="email" autocomplete="email" required autofocus></label>
    <label class="field"><span>Password</span><input class="input" type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Log in</button>
  </form>
  <p class="alt">New here? <a href="/register" id="alt">Create an account</a></p>
</div>
</main>
<footer id="footer"></footer>
</body>
</html>
