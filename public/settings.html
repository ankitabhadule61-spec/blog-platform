<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings – BlogSphere</title>
<meta name="description" content="Account settings.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232441c8'/%3E%3Crect x='8' y='18' width='16' height='6' fill='%23ffe45c'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='20' font-weight='700' text-anchor='middle' fill='white'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/app.js" defer></script>
<script src="/js/settings.js" defer></script>
</head>
<body>
<header id="nav"></header>
<main>
<div class="wrap-narrow section">
  <h1>Settings</h1>
  <p style="color:var(--ink-2);margin:0 0 22px">Update how you appear and keep your account secure.</p>

  <form class="panel" id="profileForm">
    <h2>Profile</h2>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:16px">
      <div id="avatarPrev"></div>
      <div><label class="btn sm" for="avatarFile">Upload photo</label><input id="avatarFile" type="file" accept="image/png,image/jpeg,image/gif,image/webp" class="sr-only">
      <button type="button" class="btn sm ghost" id="avatarClear">Remove</button><small style="display:block;color:var(--ink-3);margin-top:6px">PNG, JPG, GIF or WebP, up to 5MB.</small></div>
    </div>
    <label class="field"><span>Username</span><input class="input" name="username" maxlength="30" required></label>
    <label class="field"><span>Bio</span><textarea class="input" name="bio" maxlength="300" placeholder="A line or two about you"></textarea><small id="bioCount"></small></label>
    <button class="btn primary" type="submit">Save profile</button>
  </form>

  <form class="panel" id="pwForm">
    <h2>Change password</h2>
    <label class="field"><span>Current password</span><input class="input" type="password" name="currentPassword" autocomplete="current-password" required></label>
    <label class="field"><span>New password</span><input class="input" type="password" name="newPassword" autocomplete="new-password" minlength="8" required><small>At least 8 characters, with a letter and a number.</small></label>
    <button class="btn primary" type="submit">Update password</button>
  </form>

  <form class="panel danger-zone" id="delForm">
    <h2>Delete account</h2>
    <p style="color:var(--ink-2);margin-top:0">This permanently removes your account, posts and comments. It cannot be undone.</p>
    <label class="field"><span>Confirm with your password</span><input class="input" type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn danger" type="submit">Delete my account</button>
  </form>
</div>
</main>
<footer id="footer"></footer>
</body>
</html>
